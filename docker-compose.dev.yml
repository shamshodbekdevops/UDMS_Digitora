services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
      VITE_DEV_WS_PROXY_TARGET: ws://backend:8000
      VITE_WS_URL: ws://45.130.164.189
      VITE_USE_MOCK_WS: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 80

volumes:
  frontend_node_modules:
